<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AL-HUDĀ HOLY QUR'AN AWARD ‘26</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #080b17;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-radial {
            background: radial-gradient(ellipse at 50% 0%, #121c3a 0%, #080b17 75%);
            min-height: 100vh;
        }

        /* ===== MAIN TITLE ===== */
        .main-title {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2rem, 6vw, 4.6rem);
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #f7e05e, #f9b042, #f7e05e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(247, 224, 94, 0.10);
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .sub-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 0.18em;
            color: #8ab4f8;
            font-size: clamp(0.75rem, 1.8vw, 1.1rem);
            text-transform: uppercase;
        }

        .venue-tag {
            background: rgba(138, 180, 248, 0.07);
            border: 1px solid rgba(138, 180, 248, 0.10);
            padding: 0.3rem 1.4rem;
            border-radius: 40px;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            color: #8ab4f8;
            letter-spacing: 0.08em;
            backdrop-filter: blur(4px);
        }

        /* ===== WHEEL ===== */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        /* pointer */
        .wheel-pointer-outer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-pointer {
            width: 48px;
            height: 48px;
            background: linear-gradient(180deg, #f7e05e, #e8942a);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            filter: drop-shadow(0 4px 20px rgba(247, 224, 94, 0.5));
        }
        .wheel-pointer-dot {
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #fff, #d4d4d4);
            border-radius: 50%;
            margin-top: -6px;
            box-shadow: 0 0 30px rgba(247, 224, 94, 0.4);
            border: 2px solid rgba(247, 224, 94, 0.2);
        }

        .wheel-base {
            border-radius: 50%;
            box-shadow:
                0 0 50px rgba(138, 180, 248, 0.08),
                inset 0 0 80px rgba(8, 11, 23, 0.6);
            transition: transform 5.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 1/1;
            border: 2px solid rgba(247, 224, 94, 0.06);
        }

        .wheel-glow-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(247, 224, 94, 0.04);
            pointer-events: none;
            z-index: 4;
            animation: ringPulse 4s ease-in-out infinite;
        }
        @keyframes ringPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        /* ===== BUTTONS ===== */
        .btn-spin {
            background: linear-gradient(135deg, #f7e05e, #f9b042);
            color: #0b0e1a;
            font-weight: 800;
            padding: 0.85rem 3rem;
            border-radius: 60px;
            border: none;
            font-size: clamp(0.9rem, 1.3vw, 1.1rem);
            letter-spacing: 0.06em;
            box-shadow: 0 6px 35px rgba(247, 224, 94, 0.20);
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .btn-spin::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            pointer-events: none;
            border-radius: 60px;
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 50px rgba(247, 224, 94, 0.35);
        }
        .btn-spin:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #b0c8e8;
            font-weight: 600;
            padding: 0.85rem 2.4rem;
            border-radius: 60px;
            font-size: clamp(0.8rem, 1.1vw, 0.95rem);
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-2px);
        }

        .remaining-badge {
            background: rgba(138, 180, 248, 0.05);
            border: 1px solid rgba(138, 180, 248, 0.06);
            padding: 0.4rem 2rem;
            border-radius: 40px;
            font-size: clamp(0.75rem, 1vw, 0.9rem);
            color: #b0c8e8;
            font-weight: 400;
            letter-spacing: 0.03em;
            backdrop-filter: blur(4px);
        }
        .remaining-badge strong {
            color: #f7e05e;
            font-weight: 700;
        }

        /* ===== HISTORY PANEL ===== */
        .history-panel {
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 1.6rem 1.8rem;
            height: 100%;
            min-height: 300px;
            transition: all 0.3s ease;
        }
        .history-panel:hover {
            border-color: rgba(255, 255, 255, 0.05);
        }

        .history-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(0.95rem, 1.3vw, 1.15rem);
            color: #e8f0ff;
            letter-spacing: 0.04em;
        }
        .history-title span {
            background: rgba(247, 224, 94, 0.08);
            padding: 0.05rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #f7e05e;
            font-weight: 700;
            margin-left: 0.5rem;
        }

        .history-list {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 0.25rem;
            margin-top: 0.5rem;
        }
        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 10px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(247, 224, 94, 0.15);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 0.7rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            margin-bottom: 0.5rem;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.035);
            border-color: rgba(247, 224, 94, 0.06);
        }
        .history-item .h-name {
            font-weight: 700;
            font-size: clamp(0.75rem, 0.9vw, 0.85rem);
            color: #e8f0ff;
            letter-spacing: 0.02em;
        }
        .history-item .h-college {
            font-size: clamp(0.55rem, 0.7vw, 0.65rem);
            color: #8ab4f8;
            letter-spacing: 0.04em;
            background: rgba(138, 180, 248, 0.05);
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
        }
        .history-item .h-number {
            font-weight: 700;
            font-size: 0.7rem;
            color: #f7e05e;
            background: rgba(247, 224, 94, 0.06);
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .history-empty {
            color: #3a4a6a;
            font-size: 0.85rem;
            text-align: center;
            padding: 2.5rem 0;
            letter-spacing: 0.04em;
        }

        /* ===== SELECTION OVERLAY ===== */
        .selection-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 11, 23, 0.92);
            backdrop-filter: blur(24px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .selection-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .selection-overlay .close-btn {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #8a9bb8;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .selection-overlay .close-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: rotate(90deg);
        }

        .selection-card {
            text-align: center;
            padding: 2.5rem 3.5rem;
            max-width: 780px;
            width: 90%;
            animation: selectionPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: scale(0.8) translateY(30px);
            opacity: 0;
        }
        .selection-card.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        @keyframes selectionPop {
            0% {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .selection-card .badge-icon {
            display: inline-block;
            background: linear-gradient(135deg, #f7e05e, #f9b042);
            color: #0b0e1a;
            font-weight: 800;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            padding: 0.25rem 1.4rem;
            border-radius: 40px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }
        .selection-card .selected-name {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 0.3rem;
            text-shadow: 0 4px 60px rgba(247, 224, 94, 0.06);
        }
        .selection-card .selected-college {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #f7e05e;
            background: rgba(247, 224, 94, 0.05);
            display: inline-block;
            padding: 0.25rem 2rem;
            border-radius: 60px;
            border: 1px solid rgba(247, 224, 94, 0.06);
            margin-top: 0.2rem;
        }
        .selection-card .selected-id {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            color: #6a7a9a;
            margin-top: 0.8rem;
            letter-spacing: 0.1em;
        }
        .selection-card .divider-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(247, 224, 94, 0.15), transparent);
            margin: 1rem auto 0;
        }
        .selection-card .student-tag {
            display: inline-block;
            background: rgba(138, 180, 248, 0.06);
            border: 1px solid rgba(138, 180, 248, 0.08);
            padding: 0.2rem 1.4rem;
            border-radius: 40px;
            font-size: clamp(0.7rem, 1vw, 0.85rem);
            color: #8ab4f8;
            letter-spacing: 0.06em;
            margin-top: 0.6rem;
        }

        @media (max-width: 640px) {
            .selection-overlay .close-btn {
                top: 1.2rem;
                right: 1.2rem;
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }
            .selection-card {
                padding: 1.5rem;
            }
        }

        /* ===== PARTICLES ===== */
        .particle-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle-bg span {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(247, 224, 94, 0.10);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== WHEEL TEXT ===== */
        .wheel-text {
            font-size: 8px !important;
            letter-spacing: 0.04em;
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }

        /* glow pulse for wheel */
        .glow-pulse {
            animation: wheelGlow 3s ease-in-out infinite;
        }
        @keyframes wheelGlow {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(138, 180, 248, 0.04), inset 0 0 60px rgba(8, 11, 23, 0.6);
            }
            50% {
                box-shadow: 0 0 70px rgba(247, 224, 94, 0.04), inset 0 0 60px rgba(8, 11, 23, 0.6);
            }
        }

        /* spin pulse for button */
        .spin-pulse {
            animation: btnPulse 2s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 6px 35px rgba(247, 224, 94, 0.15);
            }
            50% {
                box-shadow: 0 6px 55px rgba(247, 224, 94, 0.30);
            }
        }

        /* blink for pointer */
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES ===== -->
    <div class="particle-bg" id="particleBg"></div>

    <!-- ===== SELECTION OVERLAY ===== -->
    <div class="selection-overlay" id="selectionOverlay">
        <button class="close-btn" id="closeSelectionBtn" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>
        <div class="selection-card" id="selectionCard">
            <div class="badge-icon"><i class="fas fa-trophy mr-2"></i> winner</div>
            <div class="selected-name" id="selectedNameDisplay">—</div>
            <div class="selected-college" id="selectedCollegeDisplay">—</div>
            <div class="student-tag" id="selectedStudentDisplay"><i class="fas fa-user-graduate mr-2"></i> —</div>
            <div class="selected-id" id="selectedIdDisplay"># —</div>
            <div class="divider-line"></div>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <div class="bg-radial relative z-10 p-4 md:p-6">

        <div class="max-w-6xl mx-auto">

            <!-- HEADER -->
            <header class="text-center py-4 md:py-6">
                <h1 class="main-title">AL-HUDĀ</h1>
                <p class="sub-title mt-1">Holy Qur'an Award <span class="text-white font-light mx-1">•</span> ‘26</p>
                <div class="flex flex-wrap items-center justify-center gap-3 mt-3">
                    <span class="venue-tag"><i class="fas fa-map-pin mr-2"></i> VENUE: THOOTHA</span>
                    <span class="venue-tag"><i class="fas fa-university mr-2"></i> 6 Colleges</span>
                    <span class="venue-tag"><i class="fas fa-users mr-2"></i> 18 Participants</span>
                </div>
            </header>

            <!-- GRID -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 mt-4">

                <!-- LEFT: WHEEL -->
                <div class="flex flex-col items-center">

                    <div class="wheel-wrapper">
                        <!-- pointer -->
                        <div class="wheel-pointer-outer">
                            <div class="wheel-pointer"></div>
                            <div class="wheel-pointer-dot"></div>
                        </div>

                        <div class="wheel-base glow-pulse" id="wheelBase">
                            <canvas id="wheelCanvas" width="460" height="460" style="width:100%;height:100%;display:block;"></canvas>
                            <div class="wheel-glow-ring"></div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="flex flex-wrap items-center justify-center gap-4 mt-7">
                        <button class="btn-spin spin-pulse" id="spinBtn">
                            <i class="fas fa-sync-alt mr-2"></i> Spin
                        </button>
                        <button class="btn-reset" id="resetBtn">
                            <i class="fas fa-redo-alt mr-2"></i> Reset
                        </button>
                    </div>

                    <!-- Remaining -->
                    <div class="remaining-badge mt-5" id="remainingBadge">
                        <i class="fas fa-university mr-2"></i>
                        <strong id="remainingCount">6</strong> colleges remaining
                    </div>
                </div>

                <!-- RIGHT: HISTORY -->
                <div class="history-panel">
                    <div class="flex items-center justify-between mb-3">
                        <div class="history-title">
                            <i class="fas fa-clock-rotate-left mr-2 text-blue-300"></i>
                            Selection History
                            <span id="historyCountBadge">0</span>
                        </div>
                    </div>

                    <div class="history-list" id="historyList">
                        <div class="history-empty" id="historyEmpty">
                            <i class="fas fa-inbox text-2xl block mb-2 opacity-20"></i>
                            No selections yet
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  DATA – 6 Colleges × 3 Students = 18
        // ================================================================
        const COLLEGE_DATA = [{
            id: 1,
            name: "DUIDC THOOTHA",
            students: ["MUHAMMED AFNAN", "ZAYD ALI", "HASHIR RAHMAN"],
            color: "#f7e05e"
        }, {
            id: 2,
            name: "BUAC MANIYOOR",
            students: ["FAISAL K", "ABDUL RAHMAN", "HUSSAIN M"],
            color: "#4facfe"
        }, {
            id: 3,
            name: "DH CHEMMAD",
            students: ["MUHAMMED NABEEH KT", "MUHAMMED LABEEB CK", "SALMAN AHMAD VH"],
            color: "#a770ef"
        }, {
            id: 4,
            name: "SHIC PARAPPUR",
            students: ["MUHAMMED ZUHAIR AK", "MUHAMMED NAWAF M", "MUHAMMED YASEEN KT"],
            color: "#00cdac"
        }, {
            id: 5,
            name: "DNIC VALLAPPUZHA",
            students: ["MUHAMMED AFSAL", "MUHAMMED ARIF", "MUHAMMED MISHAB"],
            color: "#ff758c"
        }, {
            id: 6,
            name: "DNAC KOONANCHERY",
            students: ["KHALEEL AL RAHMAN", "MUHAMMED HASHIM", "MUHAMMED AMEEN PM"],
            color: "#f9b042"
        }];

        // ================================================================
        //  STATE
        // ================================================================
        let available = COLLEGE_DATA.map(c => ({ ...c }));
        let selected = [];
        let isSpinning = false;
        let spinAngle = 0;
        let currentSelectionId = null;

        // Pre-compute colors for slices (6 distinct)
        const SLICE_COLORS = [
            { main: "#f7e05e", alt: "#f9b042" },
            { main: "#4facfe", alt: "#00d4ff" },
            { main: "#a770ef", alt: "#cf8bf3" },
            { main: "#00cdac", alt: "#02aab0" },
            { main: "#ff758c", alt: "#ff7eb3" },
            { main: "#f9b042", alt: "#f7e05e" }
        ];

        // ================================================================
        //  CANVAS SETUP
        // ================================================================
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function getCanvasSize() {
            const rect = canvas.getBoundingClientRect();
            const size = rect.width || 460;
            return { w: size, h: size };
        }

        function drawWheel() {
            const { w, h } = getCanvasSize();
            canvas.width = w;
            canvas.height = h;
            const cx = w / 2,
                cy = h / 2,
                radius = w / 2 - 3;

            ctx.clearRect(0, 0, w, h);

            // ----- NO COLLEGES LEFT -----
            if (available.length === 0) {
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, 'rgba(247,224,94,0.05)');
                grad.addColorStop(1, 'rgba(8,11,23,0.6)');
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#f7e05e';
                ctx.font = `bold ${radius * 0.18}px 'Playfair Display', serif`;
                ctx.fillText('🏆', cx, cy - 14);
                ctx.fillStyle = '#f7e05e';
                ctx.font = `bold ${radius * 0.12}px 'Inter', sans-serif`;
                ctx.fillText('ALL DONE!', cx, cy + 30);
                ctx.fillStyle = '#4a5a7a';
                ctx.font = `${radius * 0.07}px 'Inter', sans-serif`;
                ctx.fillText('Click RESET to start over', cx, cy + 58);

                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(247,224,94,0.05)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 12]);
                ctx.stroke();
                ctx.setLineDash([]);
                return;
            }

            const slice = (2 * Math.PI) / available.length;
            const fontSize = Math.min(radius * 0.038, 10);
            const textRadius = radius * 0.82;

            // ----- DRAW SLICES -----
            for (let i = 0; i < available.length; i++) {
                const start = spinAngle + i * slice;
                const end = start + slice;
                const ci = i % SLICE_COLORS.length;
                const c = SLICE_COLORS[ci];

                // slice fill
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, c.alt);
                grad.addColorStop(1, c.main);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();

                // border
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(8,11,23,0.35)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // divider line
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(start) * radius, cy + Math.sin(start) * radius);
                ctx.strokeStyle = 'rgba(8,11,23,0.25)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // ----- COLLEGE NAME on the slice (near rim) -----
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + slice / 2);
                ctx.translate(textRadius, 0);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 6;

                const name = available[i].name;
                // if name is long, split into two lines
                let lines = [name];
                if (name.length > 14) {
                    const parts = name.split(' ');
                    if (parts.length > 1) {
                        const mid = Math.ceil(parts.length / 2);
                        lines = [parts.slice(0, mid).join(' '), parts.slice(mid).join(' ')];
                    } else {
                        lines = [name.substring(0, Math.ceil(name.length / 2)), name.substring(Math.ceil(name.length / 2))];
                    }
                }

                const lineHeight = fontSize * 1.3;
                const totalHeight = lines.length * lineHeight;
                const startY = -totalHeight / 2 + lineHeight / 2;

                ctx.font = `bold ${fontSize}px 'Montserrat', sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                lines.forEach((line, idx) => {
                    ctx.fillText(line, 0, startY + idx * lineHeight);
                });

                ctx.shadowBlur = 0;
                ctx.restore();
            }

            // ----- outer ring -----
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // ----- inner center ring -----
            const centerR = radius * 0.13;
            const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerR);
            grad2.addColorStop(0, 'rgba(8,11,23,0.3)');
            grad2.addColorStop(1, 'rgba(8,11,23,0.7)');
            ctx.beginPath();
            ctx.arc(cx, cy, centerR, 0, Math.PI * 2);
            ctx.fillStyle = grad2;
            ctx.fill();
            ctx.strokeStyle = 'rgba(247,224,94,0.08)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // small star in center
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${centerR * 0.9}px 'Font Awesome 6 Free'`;
            ctx.fillStyle = 'rgba(247,224,94,0.15)';
            ctx.fillText('', cx, cy + 1);
        }

        // ================================================================
        //  SPIN
        // ================================================================
        function spin() {
            if (isSpinning || available.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            closeOverlay();

            const spins = 6 + Math.random() * 6;
            const idx = Math.floor(Math.random() * available.length);
            const slice = (2 * Math.PI) / available.length;
            const target = spinAngle - (2 * Math.PI * spins) - (idx * slice) - (slice / 2);

            playSpinSound();

            const pointer = document.querySelector('.wheel-pointer');
            pointer.style.animation = 'blink 0.12s infinite';

            gsap.to({ a: spinAngle }, {
                a: target,
                duration: 5.5,
                ease: "power2.inOut",
                onUpdate: function() {
                    spinAngle = this.targets()[0].a;
                    drawWheel();
                },
                onComplete: function() {
                    spinAngle = target % (2 * Math.PI);
                    if (spinAngle > 0) spinAngle -= 2 * Math.PI;

                    const chosen = available[idx];
                    // pick a random student from this college
                    const student = chosen.students[Math.floor(Math.random() * chosen.students.length)];

                    available = available.filter(c => c.id !== chosen.id);
                    selected.push({ ...chosen, selectedStudent: student });
                    currentSelectionId = chosen.id;

                    showSelection(chosen, student);
                    updateHistory(chosen, student);
                    updateRemaining();
                    playWinSound();
                    triggerConfetti();

                    setTimeout(() => {
                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = available.length === 0;
                        pointer.style.animation = '';
                    }, 700);

                    drawWheel();
                }
            });
        }

        // ================================================================
        //  SHOW FULL-SCREEN SELECTION
        // ================================================================
        function showSelection(college, student) {
            const overlay = document.getElementById('selectionOverlay');
            const card = document.getElementById('selectionCard');
            const nameEl = document.getElementById('selectedNameDisplay');
            const collegeEl = document.getElementById('selectedCollegeDisplay');
            const studentEl = document.getElementById('selectedStudentDisplay');
            const idEl = document.getElementById('selectedIdDisplay');

            nameEl.textContent = college.name.toUpperCase();
            collegeEl.textContent = college.name.toUpperCase();
            studentEl.innerHTML = `<i class="fas fa-user-graduate mr-2"></i> ${student.toUpperCase()}`;
            idEl.textContent = '# ' + college.id;

            card.style.animation = 'none';
            void card.offsetWidth;
            card.style.animation = 'selectionPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

            overlay.classList.add('active');
        }

        function closeOverlay() {
            document.getElementById('selectionOverlay').classList.remove('active');
        }

        // ================================================================
        //  HISTORY
        // ================================================================
        function updateHistory(college, student) {
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');
            if (empty) empty.style.display = 'none';

            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = 'history-item';
            div.style.opacity = '0';
            div.style.transform = 'translateY(12px)';

            div.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="h-name">${college.name.toUpperCase()}</span>
                            <span class="h-college">${student.toUpperCase()}</span>
                        </div>
                        <div class="flex items-center gap-3 flex-shrink-0">
                            <span class="text-xs text-blue-300/30">${time}</span>
                            <span class="h-number">${selected.length}</span>
                        </div>
                    `;

            list.prepend(div);
            gsap.to(div, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" });

            document.getElementById('historyCountBadge').textContent = selected.length;
        }

        // ================================================================
        //  REMAINING
        // ================================================================
        function updateRemaining() {
            const el = document.getElementById('remainingCount');
            const badge = document.getElementById('remainingBadge');

            if (available.length === 0) {
                el.textContent = '0';
                badge.innerHTML = `
                            <i class="fas fa-check-circle mr-2 text-green-400"></i>
                            <span style="color:#f7e05e;font-weight:600;">All colleges selected!</span>
                        `;
            } else {
                el.textContent = available.length;
                badge.innerHTML = `
                            <i class="fas fa-university mr-2"></i>
                            <strong id="remainingCount">${available.length}</strong> colleges remaining
                        `;
            }
        }

        // ================================================================
        //  RESET
        // ================================================================
        function resetAll() {
            if (isSpinning) return;

            available = COLLEGE_DATA.map(c => ({ ...c }));
            selected = [];
            currentSelectionId = null;
            spinAngle = 0;

            closeOverlay();

            const list = document.getElementById('historyList');
            const items = list.querySelectorAll('.history-item');
            gsap.to(items, {
                opacity: 0,
                y: -10,
                stagger: 0.03,
                duration: 0.2,
                onComplete: () => {
                    list.innerHTML = `
                                <div class="history-empty" id="historyEmpty">
                                    <i class="fas fa-inbox text-2xl block mb-2 opacity-20"></i>
                                    No selections yet
                                </div>
                            `;
                }
            });

            document.getElementById('historyCountBadge').textContent = '0';
            document.getElementById('spinBtn').disabled = false;
            updateRemaining();

            gsap.to('.wheel-base', {
                rotation: 360,
                duration: 1.2,
                ease: "elastic.out(1, 0.5)",
                onComplete: () => {
                    drawWheel();
                }
            });
        }

        // ================================================================
        //  SOUNDS
        // ================================================================
        function playSpinSound() {
            try {
                const actx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.frequency.setValueAtTime(280, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(720, actx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.05, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
                osc.start(actx.currentTime);
                osc.stop(actx.currentTime + 0.35);
            } catch (_) {}
        }

        function playWinSound() {
            try {
                const actx = new(window.AudioContext || window.webkitAudioContext)();
                const freqs = [523, 659, 784, 1047];
                freqs.forEach((f, i) => {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.frequency.setValueAtTime(f, actx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.04, actx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + i * 0.1 + 0.2);
                    osc.start(actx.currentTime + i * 0.1);
                    osc.stop(actx.currentTime + i * 0.1 + 0.2);
                });
            } catch (_) {}
        }

        // ================================================================
        //  CONFETTI
        // ================================================================
        function triggerConfetti() {
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => {
                confetti({ particleCount: 30, angle: 60, spread: 55, origin: { x: 0.1, y: 0.5 } });
            }, 150);
            setTimeout(() => {
                confetti({ particleCount: 30, angle: 120, spread: 55, origin: { x: 0.9, y: 0.5 } });
            }, 280);
        }

        // ================================================================
        //  PARTICLES
        // ================================================================
        function initParticles() {
            const container = document.getElementById('particleBg');
            for (let i = 0; i < 40; i++) {
                const span = document.createElement('span');
                const size = 1 + Math.random() * 2.5;
                span.style.width = size + 'px';
                span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = 14 + Math.random() * 22 + 's';
                span.style.animationDelay = Math.random() * 16 + 's';
                span.style.opacity = 0.08 + Math.random() * 0.2;
                container.appendChild(span);
            }
        }
        initParticles();

        // ================================================================
        //  EVENT LISTENERS
        // ================================================================
        document.getElementById('spinBtn').addEventListener('click', spin);
        document.getElementById('resetBtn').addEventListener('click', resetAll);
        document.getElementById('closeSelectionBtn').addEventListener('click', closeOverlay);

        document.getElementById('selectionOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeOverlay();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeOverlay();
        });

        // ================================================================
        //  INIT
        // ================================================================
        drawWheel();
        updateRemaining();

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => drawWheel(), 120);
        });

        // initial subtle animation
        gsap.to('.wheel-base', {
            boxShadow: '0 0 70px rgba(247,224,94,0.04), inset 0 0 60px rgba(8,11,23,0.6)',
            duration: 2,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut"
        });
    </script>
</body>
</html>
