<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AL-HUDĀ HOLY QUR'AN AWARD ‘26</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg-1: #07101c;
      --bg-2: #0d1628;
      --bg-3: #14213a;
      --gold-1: #f7e05e;
      --gold-2: #f9b042;
      --blue-1: #8ab4f8;
      --blue-2: #5da8ff;
      --text-soft: #bfd0eb;
      --panel: rgba(255,255,255,0.045);
      --panel-border: rgba(255,255,255,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(37, 72, 132, 0.28), transparent 34%),
        radial-gradient(circle at 10% 20%, rgba(247, 224, 94, 0.08), transparent 24%),
        radial-gradient(circle at 90% 10%, rgba(93, 168, 255, 0.08), transparent 24%),
        linear-gradient(180deg, #08111e 0%, #0b1322 45%, #08101b 100%);
    }

    .page-wrap {
      position: relative;
      min-height: 100vh;
      padding: 24px 16px 48px;
      z-index: 2;
    }

    .bg-particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-particles span {
      position: absolute;
      border-radius: 999px;
      background: rgba(247, 224, 94, 0.18);
      box-shadow: 0 0 12px rgba(247, 224, 94, 0.2);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.7);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-15vh) scale(1.2);
        opacity: 0;
      }
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2.1rem, 7vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #fff2a8, #f7e05e, #f9b042, #fff2a8);
      background-size: 220% 220%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4.5s ease-in-out infinite;
      text-shadow: 0 0 40px rgba(247, 224, 94, 0.08);
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .sub-title {
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--blue-1);
      font-size: clamp(0.82rem, 2.2vw, 1.1rem);
      margin-top: 8px;
    }

    .tag {
      background: rgba(138, 180, 248, 0.08);
      border: 1px solid rgba(138, 180, 248, 0.15);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.86rem;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
    }

    .glass-panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.03);
      border-radius: 26px;
      backdrop-filter: blur(14px);
    }

    .wheel-area {
      padding: 20px 20px 26px;
      position: relative;
    }

    .wheel-shell {
      position: relative;
      width: min(88vw, 520px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .wheel-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(247,224,94,0.10) 0%, rgba(247,224,94,0.02) 45%, transparent 72%);
      filter: blur(10px);
      animation: auraPulse 3s ease-in-out infinite;
    }

    @keyframes auraPulse {
      0%, 100% { transform: scale(0.98); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    .pointer-wrap {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      pointer-events: none;
    }

    .pointer-cap {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #fffef3, #f7e05e 50%, #d6922d 100%);
      box-shadow:
        0 0 30px rgba(247, 224, 94, 0.45),
        0 0 0 6px rgba(247, 224, 94, 0.08);
      z-index: 2;
    }

    .pointer {
      width: 58px;
      height: 66px;
      margin-top: -5px;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      background: linear-gradient(180deg, #fff1a4 0%, #f7e05e 35%, #f9b042 100%);
      filter: drop-shadow(0 8px 18px rgba(247, 224, 94, 0.45));
      transform-origin: top center;
    }

    .pointer.ticking {
      animation: pointerTick 0.12s linear infinite;
    }

    @keyframes pointerTick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }

    .wheel-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 14px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(145deg, rgba(247,224,94,0.20), rgba(93,168,255,0.12));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 16px 50px rgba(0,0,0,0.38),
        0 0 40px rgba(247,224,94,0.10);
    }

    .wheel-rotator {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 5.2s cubic-bezier(0.08, 0.86, 0.14, 1);
      will-change: transform;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,0.02),
        inset 0 0 60px rgba(0,0,0,0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .center-cap {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fffbe0 0%, #f7e05e 28%, #c98d2d 70%, #7a531c 100%);
      box-shadow:
        0 0 0 10px rgba(255,255,255,0.05),
        0 0 0 18px rgba(247,224,94,0.08),
        0 10px 30px rgba(0,0,0,0.35);
      z-index: 5;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 900;
      color: #0a1322;
      line-height: 1.05;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px;
    }

    .wheel-center-ring {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .btn-primary {
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #fff1a4 0%, #f7e05e 45%, #f9b042 100%);
      color: #08111e;
      box-shadow: 0 14px 28px rgba(247, 224, 94, 0.22);
      transition: 0.25s ease;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 36px rgba(247, 224, 94, 0.30);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      padding: 14px 28px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #d6e3f8;
      background: rgba(255,255,255,0.045);
      transition: 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
      transform: translateY(-2px);
    }

    .status-badge {
      margin-top: 18px;
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(138, 180, 248, 0.07);
      border: 1px solid rgba(138, 180, 248, 0.12);
      color: #d8e6ff;
      font-size: 0.96rem;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .status-badge strong {
      color: var(--gold-1);
      font-weight: 800;
    }

    .history-panel {
      padding: 22px;
      min-height: 100%;
    }

    .history-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.06rem;
      font-weight: 800;
      color: #eef5ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(247, 224, 94, 0.10);
      color: var(--gold-1);
      font-weight: 800;
      font-size: 0.86rem;
      border: 1px solid rgba(247, 224, 94, 0.14);
    }

    .history-list {
      margin-top: 18px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(247,224,94,0.18);
      border-radius: 999px;
    }

    .history-empty {
      padding: 48px 12px;
      text-align: center;
      color: #6a7a96;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.05);
      transition: 0.25s ease;
    }

    .history-item:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.05);
      border-color: rgba(247,224,94,0.10);
    }

    .history-name {
      font-weight: 800;
      color: #f5f8ff;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .history-meta {
      font-size: 0.78rem;
      color: #8ab4f8;
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .history-order {
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(247,224,94,0.08);
      border: 1px solid rgba(247,224,94,0.12);
      color: var(--gold-1);
      font-size: 0.82rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(6, 10, 18, 0.90);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      width: min(920px, 96vw);
      border-radius: 30px;
      padding: 34px 28px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(247,224,94,0.12), rgba(255,255,255,0.04) 36%, rgba(255,255,255,0.03) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 20px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
      transform: scale(0.90) translateY(16px);
      opacity: 0;
      transition: 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .overlay.active .result-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      padding: 9px 18px;
      background: linear-gradient(135deg, #fff1a4 0%, #f7e05e 45%, #f9b042 100%);
      color: #08111e;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 22px;
      box-shadow: 0 10px 24px rgba(247,224,94,0.2);
    }

    .result-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 8vw, 5.1rem);
      line-height: 1.08;
      font-weight: 900;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-shadow: 0 0 40px rgba(247,224,94,0.08);
    }

    .result-sub {
      margin-top: 18px;
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(247,224,94,0.08);
      border: 1px solid rgba(247,224,94,0.12);
      color: var(--gold-1);
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.25rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .result-note {
      margin-top: 14px;
      color: #92a8c8;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .close-overlay {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: #d5e3f8;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      transition: 0.25s ease;
    }

    .close-overlay:hover {
      transform: rotate(90deg);
      background: rgba(255,255,255,0.09);
      color: white;
    }

    .done-state {
      text-align: center;
      color: #a8c2e8;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.06em;
    }

    @media (max-width: 1024px) {
      .history-panel {
        min-height: 300px;
      }
    }

    @media (max-width: 640px) {
      .page-wrap {
        padding-top: 18px;
      }

      .wheel-area,
      .history-panel {
        padding: 18px;
      }

      .pointer {
        width: 50px;
        height: 58px;
      }

      .pointer-cap {
        width: 24px;
        height: 24px;
      }

      .center-cap {
        width: 74px;
        height: 74px;
        font-size: 0.62rem;
      }

      .close-overlay {
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="bgParticles"></div>

  <div class="overlay" id="resultOverlay">
    <button class="close-overlay" id="closeOverlayBtn" aria-label="Close">
      <i class="fas fa-times"></i>
    </button>

    <div class="result-card">
      <div class="result-badge">
        <i class="fas fa-star"></i>
        Selected
      </div>

      <div class="result-title" id="resultCollege">—</div>
      <div class="result-sub">College Selected</div>
      <div class="result-note" id="resultOrder">Selection #1</div>
    </div>
  </div>

  <div class="page-wrap">
    <div class="max-w-7xl mx-auto relative z-10">
      <header class="text-center py-3 md:py-6">
        <h1 class="main-title">AL-HUDĀ</h1>
        <div class="sub-title">Holy Qur'an Award • ‘26</div>

        <div class="flex flex-wrap justify-center gap-3 mt-5">
          <div class="tag"><i class="fas fa-map-marker-alt mr-2"></i>Venue: Thootha</div>
          <div class="tag"><i class="fas fa-university mr-2"></i>6 Colleges</div>
          <div class="tag"><i class="fas fa-bullseye mr-2"></i>Exact Center Stop</div>
        </div>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-10 mt-6">
        <!-- LEFT -->
        <div class="glass-panel wheel-area">
          <div class="wheel-shell">
            <div class="wheel-aura"></div>

            <div class="pointer-wrap">
              <div class="pointer-cap"></div>
              <div class="pointer" id="pointer"></div>
            </div>

            <div class="wheel-frame">
              <div class="wheel-rotator" id="wheelRotator">
                <canvas id="wheelCanvas" width="700" height="700"></canvas>
              </div>
            </div>

            <div class="wheel-center-ring"></div>
            <div class="center-cap">AL<br>HUDĀ</div>
          </div>

          <div class="flex flex-wrap justify-center gap-4 mt-8">
            <button class="btn-primary" id="spinBtn">
              <i class="fas fa-arrows-rotate mr-2"></i>Spin Wheel
            </button>

            <button class="btn-secondary" id="resetBtn">
              <i class="fas fa-redo-alt mr-2"></i>Reset
            </button>
          </div>

          <div class="status-badge mt-5" id="remainingBadge">
            <i class="fas fa-layer-group mr-2"></i>
            <strong id="remainingCount">6</strong> colleges remaining
          </div>
        </div>

        <!-- RIGHT -->
        <div class="glass-panel history-panel">
          <div class="flex items-center justify-between">
            <div class="history-title">
              <i class="fas fa-clock-rotate-left mr-2 text-blue-300"></i>
              Selection History
            </div>
            <div class="count-pill" id="historyCount">0</div>
          </div>

          <div class="history-list" id="historyList">
            <div class="history-empty" id="historyEmpty">
              <i class="fas fa-inbox text-3xl block mb-3 opacity-25"></i>
              No college selected yet
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // DATA - ONLY 6 COLLEGES
    // =========================================================
    const INITIAL_COLLEGES = [
      { name: "DUIDC THOOTHA", code: "01" },
      { name: "BUAC MANIYOOR", code: "02" },
      { name: "DH CHEMMAD", code: "03" },
      { name: "SHIC PARAPPUR", code: "04" },
      { name: "DNIC VALLAPPUZHA", code: "05" },
      { name: "DNAC KOONANCHERY", code: "06" }
    ];

    // =========================================================
    // STATE
    // =========================================================
    let availableColleges = [...INITIAL_COLLEGES];
    let selectedColleges = [];
    let isSpinning = false;
    let currentRotation = 0;

    const wheelCanvas = document.getElementById('wheelCanvas');
    const ctx = wheelCanvas.getContext('2d');
    const wheelRotator = document.getElementById('wheelRotator');
    const pointer = document.getElementById('pointer');

    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');

    const remainingBadge = document.getElementById('remainingBadge');
    const remainingCount = document.getElementById('remainingCount');

    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const historyCount = document.getElementById('historyCount');

    const resultOverlay = document.getElementById('resultOverlay');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');
    const resultCollege = document.getElementById('resultCollege');
    const resultOrder = document.getElementById('resultOrder');

    const SLICE_COLORS = [
      ["#F7E05E", "#F9B042"],
      ["#5DA8FF", "#327AFF"],
      ["#9F73FF", "#C28BFF"],
      ["#00D1B2", "#02AAB0"],
      ["#FF7B9D", "#FF9D73"],
      ["#6DD5FA", "#2980B9"]
    ];

    // =========================================================
    // BACKGROUND PARTICLES
    // =========================================================
    function initParticles() {
      const bg = document.getElementById('bgParticles');
      bg.innerHTML = "";
      for (let i = 0; i < 55; i++) {
        const s = document.createElement('span');
        const size = (Math.random() * 3 + 1).toFixed(2);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100) + '%';
        s.style.animationDuration = (12 + Math.random() * 18).toFixed(2) + 's';
        s.style.animationDelay = (Math.random() * 14).toFixed(2) + 's';
        s.style.opacity = (0.12 + Math.random() * 0.22).toFixed(2);
        bg.appendChild(s);
      }
    }
    initParticles();

    // =========================================================
    // HELPERS
    // =========================================================
    function getCanvasSize() {
      const box = wheelRotator.getBoundingClientRect();
      const size = Math.max(300, Math.floor(box.width || 520));
      return size;
    }

    function splitLabel(label) {
      const words = label.split(' ');
      if (words.length <= 2) return words;
      if (words.length === 3) return [words[0], words.slice(1).join(' ')];
      return [
        words.slice(0, 2).join(' '),
        words.slice(2).join(' ')
      ];
    }

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function playSpinSound() {
      try {
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = actx.createOscillator();
        const gain = actx.createGain();

        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(actx.destination);

        osc.frequency.setValueAtTime(180, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(680, actx.currentTime + 0.28);

        gain.gain.setValueAtTime(0.055, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.30);

        osc.start();
        osc.stop(actx.currentTime + 0.30);
      } catch (e) {}
    }

    function playWinSound() {
      try {
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(actx.destination);

          const start = actx.currentTime + i * 0.08;
          osc.frequency.setValueAtTime(f, start);

          gain.gain.setValueAtTime(0.045, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);

          osc.start(start);
          osc.stop(start + 0.18);
        });
      } catch (e) {}
    }

    function fireConfetti() {
      confetti({
        particleCount: 90,
        spread: 80,
        origin: { y: 0.6 }
      });
      setTimeout(() => {
        confetti({
          particleCount: 55,
          angle: 60,
          spread: 60,
          origin: { x: 0.1, y: 0.5 }
        });
      }, 160);
      setTimeout(() => {
        confetti({
          particleCount: 55,
          angle: 120,
          spread: 60,
          origin: { x: 0.9, y: 0.5 }
        });
      }, 280);
    }

    // =========================================================
    // DRAW WHEEL
    // =========================================================
    function drawWheel() {
      const size = getCanvasSize();
      wheelCanvas.width = size;
      wheelCanvas.height = size;

      const cx = size / 2;
      const cy = size / 2;
      const radius = size / 2 - 10;

      ctx.clearRect(0, 0, size, size);

      if (availableColleges.length === 0) {
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, "rgba(247,224,94,0.14)");
        grad.addColorStop(0.55, "rgba(255,255,255,0.04)");
        grad.addColorStop(1, "rgba(8,17,30,0.92)");

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, radius - 8, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#f7e05e";
        ctx.font = `900 ${Math.max(28, size * 0.06)}px Montserrat`;
        ctx.fillText("ALL SELECTED", cx, cy - 10);

        ctx.fillStyle = "#9ab0d0";
        ctx.font = `600 ${Math.max(15, size * 0.026)}px Inter`;
        ctx.fillText("Click RESET to start again", cx, cy + 34);
        return;
      }

      const count = availableColleges.length;
      const sliceAngle = (Math.PI * 2) / count;
      const baseStart = -Math.PI / 2 - sliceAngle / 2;

      // outer shadow circle
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fill();

      // slices
      for (let i = 0; i < count; i++) {
        const start = baseStart + i * sliceAngle;
        const end = start + sliceAngle;
        const centerAngle = start + sliceAngle / 2;
        const [c1, c2] = SLICE_COLORS[i % SLICE_COLORS.length];

        const grad = ctx.createLinearGradient(
          cx + Math.cos(start) * radius,
          cy + Math.sin(start) * radius,
          cx + Math.cos(end) * radius,
          cy + Math.sin(end) * radius
        );
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // glossy overlay
        const gloss = ctx.createRadialGradient(cx, cy - radius * 0.25, 0, cx, cy, radius);
        gloss.addColorStop(0, "rgba(255,255,255,0.14)");
        gloss.addColorStop(0.4, "rgba(255,255,255,0.05)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = gloss;
        ctx.fill();

        // divider
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(start) * radius, cy + Math.sin(start) * radius);
        ctx.strokeStyle = "rgba(10,19,34,0.34)";
        ctx.lineWidth = Math.max(2, size * 0.005);
        ctx.stroke();

        // label
        const labelLines = splitLabel(availableColleges[i].name);
        const labelRadius = radius * 0.64;
        const tx = cx + Math.cos(centerAngle) * labelRadius;
        const ty = cy + Math.sin(centerAngle) * labelRadius;

        ctx.save();
        ctx.translate(tx, ty);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // auto font sizing
        const fontSize = Math.max(12, Math.min(22, size / (count <= 4 ? 25 : 28)));
        const lineHeight = fontSize * 1.1;

        ctx.font = `900 ${fontSize}px Montserrat`;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "rgba(0,0,0,0.38)";
        ctx.lineWidth = 5;
        ctx.lineJoin = "round";

        const totalHeight = (labelLines.length - 1) * lineHeight;
        labelLines.forEach((line, idx) => {
          const y = idx * lineHeight - totalHeight / 2;
          ctx.strokeText(line, 0, y);
          ctx.fillText(line, 0, y);
        });

        ctx.restore();
      }

      // outer ring
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = Math.max(4, size * 0.01);
      ctx.stroke();

      // inner ring
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.23, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,17,30,0.22)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // =========================================================
    // HISTORY / STATUS
    // =========================================================
    function updateRemaining() {
      if (availableColleges.length === 0) {
        remainingBadge.innerHTML = `
          <i class="fas fa-check-circle mr-2 text-green-400"></i>
          <span style="color:#f7e05e;font-weight:800;">All colleges selected</span>
        `;
      } else {
        remainingBadge.innerHTML = `
          <i class="fas fa-layer-group mr-2"></i>
          <strong id="remainingCount">${availableColleges.length}</strong> colleges remaining
        `;
      }
    }

    function addHistory(college) {
      if (historyEmpty) historyEmpty.style.display = 'none';

      const order = selectedColleges.length;
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.opacity = '0';
      item.style.transform = 'translateY(10px)';

      item.innerHTML = `
        <div class="min-w-0">
          <div class="history-name">${college.name}</div>
          <div class="history-meta">Selected at ${formatTime()}</div>
        </div>
        <div class="history-order">${order}</div>
      `;

      historyList.prepend(item);
      historyCount.textContent = order;

      gsap.to(item, {
        opacity: 1,
        y: 0,
        duration: 0.35,
        ease: "power2.out"
      });
    }

    // =========================================================
    // OVERLAY
    // =========================================================
    function showResult(college) {
      resultCollege.textContent = college.name;
      resultOrder.textContent = `Selection #${selectedColleges.length}`;
      resultOverlay.classList.add('active');
    }

    function closeResult() {
      resultOverlay.classList.remove('active');
    }

    // =========================================================
    // PERFECT SPIN
    // =========================================================
    function spinWheel() {
      if (isSpinning || availableColleges.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;
      closeResult();

      const count = availableColleges.length;
      const chosenIndex = Math.floor(Math.random() * count);
      const sliceDeg = 360 / count;

      // Because slice 0 is centered at the pointer on 0deg,
      // target normalized rotation for selected index is:
      const targetNormalized = (360 - chosenIndex * sliceDeg) % 360;
      const currentNormalized = ((currentRotation % 360) + 360) % 360;

      let delta = targetNormalized - currentNormalized;
      if (delta < 0) delta += 360;

      const extraTurns = (6 + Math.floor(Math.random() * 3)) * 360;
      const finalRotation = currentRotation + extraTurns + delta;

      isSpinning = true;
      pointer.classList.add('ticking');
      playSpinSound();

      wheelRotator.style.transition = 'transform 5.2s cubic-bezier(0.08, 0.86, 0.14, 1)';
      wheelRotator.style.transform = `rotate(${finalRotation}deg)`;

      const onDone = () => {
        wheelRotator.removeEventListener('transitionend', onDone);
        currentRotation = finalRotation;

        const chosen = availableColleges.splice(chosenIndex, 1)[0];
        selectedColleges.push(chosen);

        playWinSound();
        fireConfetti();
        addHistory(chosen);
        updateRemaining();
        showResult(chosen);

        // redraw wheel without selected slice and reset visible wheel to 0deg for clean next spin
        setTimeout(() => {
          wheelRotator.style.transition = 'none';
          wheelRotator.style.transform = 'rotate(0deg)';
          currentRotation = 0;
          drawWheel();

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              wheelRotator.style.transition = 'transform 5.2s cubic-bezier(0.08, 0.86, 0.14, 1)';
              pointer.classList.remove('ticking');
              isSpinning = false;
              spinBtn.disabled = availableColleges.length === 0;
            });
          });
        }, 40);
      };

      wheelRotator.addEventListener('transitionend', onDone, { once: true });
    }

    // =========================================================
    // RESET
    // =========================================================
    function resetAll() {
      if (isSpinning) return;

      availableColleges = [...INITIAL_COLLEGES];
      selectedColleges = [];
      currentRotation = 0;

      closeResult();

      wheelRotator.style.transition = 'none';
      wheelRotator.style.transform = 'rotate(0deg)';

      historyList.innerHTML = `
        <div class="history-empty" id="historyEmpty">
          <i class="fas fa-inbox text-3xl block mb-3 opacity-25"></i>
          No college selected yet
        </div>
      `;

      historyCount.textContent = '0';
      spinBtn.disabled = false;
      updateRemaining();
      drawWheel();

      gsap.fromTo(wheelRotator,
        { scale: 0.96, rotate: -12 },
        {
          scale: 1,
          rotate: 0,
          duration: 0.9,
          ease: "elastic.out(1, 0.55)",
          clearProps: "transform"
        }
      );
    }

    // =========================================================
    // EVENTS
    // =========================================================
    spinBtn.addEventListener('click', spinWheel);
    resetBtn.addEventListener('click', resetAll);
    closeOverlayBtn.addEventListener('click', closeResult);

    resultOverlay.addEventListener('click', (e) => {
      if (e.target === resultOverlay) closeResult();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeResult();
      if (e.key === ' ' && !isSpinning && availableColleges.length > 0) {
        e.preventDefault();
        spinWheel();
      }
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        drawWheel();
      }, 120);
    });

    // =========================================================
    // INIT
    // =========================================================
    updateRemaining();
    drawWheel();

    gsap.from(".wheel-shell", {
      scale: 0.92,
      opacity: 0,
      duration: 0.9,
      ease: "power3.out"
    });

    gsap.from(".history-panel", {
      y: 20,
      opacity: 0,
      duration: 0.8,
      delay: 0.1,
      ease: "power3.out"
    });
  </script>
</body>
</html>
