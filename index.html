<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎡 College Spin · 6 slices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 4rem 4rem 3rem 3rem;
      padding: 2rem 1.8rem 2.5rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.25s;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 2.1rem;
      letter-spacing: 1px;
      color: #f2e9d0;
      text-shadow: 0 4px 10px #00000055, 0 0 0 2px #3b5a78;
      margin-top: -0.2rem;
      margin-bottom: 1.5rem;
      word-break: break-word;
    }
    h1 small {
      font-size: 1rem;
      font-weight: 400;
      opacity: 0.8;
      display: inline-block;
      margin-left: 0.5rem;
      background: #1f3d57;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      color: #d6e5f0;
      text-shadow: none;
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      aspect-ratio: 1/1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 0 4px #3a5f7a, 0 0 0 8px #1f3346;
      transition: box-shadow 0.2s;
      background: #182b3b;
      cursor: pointer;
      touch-action: none;
    }

    canvas:active {
      box-shadow: 0 8px 25px #000000cc, 0 0 0 4px #5f8aa8, 0 0 0 8px #26415a;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 40px solid #f8d36b;
      filter: drop-shadow(0 8px 8px #00000077);
      z-index: 10;
      transition: 0.15s;
    }
    .pointer::after {
      content: '';
      position: absolute;
      top: -46px;
      left: -12px;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #fce38a, #dba42b);
      border-radius: 50%;
      box-shadow: 0 0 0 4px #1f2e3d;
    }

    .result-area {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem 1.5rem;
      background: #0e1e2dcc;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 0.9rem 2rem;
      border-radius: 60px;
      border: 1px solid #3e607b;
      box-shadow: inset 0 2px 5px #00000055, 0 6px 12px #00000044;
    }

    .result-label {
      color: #b4cfE6;
      font-weight: 400;
      letter-spacing: 1px;
      font-size: 1rem;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #selectedCollege {
      background: #f5efe0;
      padding: 0.4rem 1.8rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.6rem;
      color: #0d2538;
      box-shadow: inset 0 -2px 0 #afc9dd, 0 4px 12px #00000055;
      min-width: 140px;
      text-align: center;
      letter-spacing: 0.5px;
      transition: 0.2s;
      border: 2px solid #d7b15d;
    }

    .btn-spin {
      background: #dfc27d;
      border: none;
      padding: 0.8rem 2.2rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.3rem;
      color: #142734;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 8px 0 #8f6f38, 0 10px 20px #00000055;
      transition: 0.07s linear;
      cursor: pointer;
      border: 1px solid #f8e3a5;
      letter-spacing: 1px;
      margin-top: 0.4rem;
    }

    .btn-spin:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #6d4f28, 0 6px 14px #00000066;
    }

    .btn-spin:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #6d4f28;
      pointer-events: none;
    }

    .spin-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .footer-note {
      display: flex;
      justify-content: center;
      margin-top: 0.8rem;
      color: #7b99b3;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    @media (max-width: 550px) {
      .card { padding: 1.2rem 1rem 1.8rem; }
      h1 { font-size: 1.6rem; }
      .result-area { flex-direction: column; gap: 0.5rem; padding: 1rem 1.2rem; }
      #selectedCollege { font-size: 1.4rem; min-width: 120px; }
      .btn-spin { font-size: 1.1rem; padding: 0.6rem 1.5rem; }
      .pointer { top: -12px; border-left-width: 16px; border-right-width: 16px; border-top-width: 28px; }
      .pointer::after { top: -34px; left: -8px; width: 16px; height: 16px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🎓 SPIN<span style="font-weight:300; margin-left:6px;">&</span> PICK <small>6 colleges</small></h1>

  <div class="wheel-wrapper">
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="pointer" aria-hidden="true"></div>
  </div>

  <div class="result-area">
    <span class="result-label">🏆 selected</span>
    <span id="selectedCollege">—</span>
    <button class="btn-spin" id="spinBtn"><span class="spin-icon">⟳</span> SPIN</button>
  </div>
  <div class="footer-note">⬆ click wheel or press SPIN</div>
</div>

<script>
  (function() {
    // ----- COLLEGES (6 slices) -----
    const COLLEGES = [
      "DUIDC THOOTHA",
      "BUAC MANIYOOR",
      "DH CHEMMAD",
      "SHIC PARAPPUR",
      "DNIC VALLAPPUZHA",
      "DNAC KOONANCHERY"
    ];

    // ----- canvas setup -----
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const selectedSpan = document.getElementById('selectedCollege');

    // ----- wheel state -----
    let currentAngle = 0;          // rotation in radians
    let isSpinning = false;
    let animationId = null;
    let spinVelocity = 0;
    const friction = 0.985;        // deceleration per frame
    const minSpin = 0.012;         // stop when velocity below this

    // slice angle (6 slices)
    const sliceAngle = (2 * Math.PI) / COLLEGES.length;

    // ----- helper: draw the wheel -----
    function drawWheel(rotation) {
      const w = canvas.width;
      const h = canvas.height;
      const radius = Math.min(w, h) * 0.44;  // leave room for pointer
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      // vibrant colors for 6 slices
      const colors = [
        '#E6514A', // red
        '#F9A825', // amber
        '#43A047', // green
        '#1E88E5', // blue
        '#8E24AA', // purple
        '#FB8C00'  // orange
      ];

      // draw each slice
      for (let i = 0; i < COLLEGES.length; i++) {
        const start = i * sliceAngle + rotation;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#f5f1e0';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // label
        const midAngle = start + sliceAngle / 2;
        const labelRadius = radius * 0.68;
        const x = cx + Math.cos(midAngle) * labelRadius;
        const y = cy + Math.sin(midAngle) * labelRadius;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(midAngle + (midAngle > Math.PI/2 ? Math.PI : 0));
        ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00000088';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#000000bb';
        ctx.shadowBlur = 12;

        // split long names into two lines if needed (optional)
        const name = COLLEGES[i];
        let displayName = name;
        // if name has space, break into two lines for better fit
        if (name.includes(' ')) {
          const parts = name.split(' ');
          if (parts.length === 2) {
            // show as two lines
            ctx.font = 'bold 15px "Segoe UI", system-ui, sans-serif';
            ctx.fillText(parts[0], 0, -10);
            ctx.fillText(parts[1], 0, 14);
          } else {
            ctx.fillText(name, 0, 0);
          }
        } else {
          ctx.fillText(name, 0, 0);
        }
        ctx.restore();
      }

      // center dot
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.08, 0, 2 * Math.PI);
      ctx.fillStyle = '#f7f3e3';
      ctx.shadowColor = '#000000aa';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#1f2e3d';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // ----- get college under pointer (top = -90° offset) -----
    function getCollegeFromAngle(rotation) {
      // pointer is at top: -PI/2 (12 o'clock)
      const pointerAngle = -Math.PI / 2; 
      // angle from center to pointer (in wheel space)
      let raw = (pointerAngle - rotation) % (2 * Math.PI);
      if (raw < 0) raw += 2 * Math.PI;
      const index = Math.floor(raw / sliceAngle);
      // clamp (just in case)
      return COLLEGES[Math.min(index, COLLEGES.length - 1)];
    }

    // ----- update result display -----
    function updateResult(rotation) {
      const college = getCollegeFromAngle(rotation);
      selectedSpan.textContent = college;
    }

    // ----- animation loop -----
    function spinAnimation() {
      if (!isSpinning) return;

      // apply friction
      spinVelocity *= friction;

      // if nearly stopped, end spin
      if (Math.abs(spinVelocity) < minSpin) {
        spinVelocity = 0;
        isSpinning = false;
        animationId = null;
        spinBtn.disabled = false;
        // final result
        updateResult(currentAngle);
        return;
      }

      // update angle
      currentAngle = (currentAngle + spinVelocity) % (2 * Math.PI);
      drawWheel(currentAngle);
      // live update selected (optional, but nice)
      updateResult(currentAngle);

      // continue
      animationId = requestAnimationFrame(spinAnimation);
    }

    // ----- start spin with random velocity -----
    function startSpin() {
      if (isSpinning) {
        // if already spinning, do nothing (or stop / re-trigger? we choose to ignore)
        return;
      }

      // random velocity: between 0.45 and 1.0 rad/frame (plus some randomness)
      const baseSpeed = 0.45 + Math.random() * 0.65;
      // add random direction (clockwise always positive, but can be negative too)
      const direction = Math.random() > 0.5 ? 1 : -1;
      spinVelocity = direction * baseSpeed * (0.9 + Math.random() * 0.3);

      isSpinning = true;
      spinBtn.disabled = true;

      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(spinAnimation);
    }

    // ----- click on canvas spins -----
    function handleCanvasClick(e) {
      e.preventDefault();
      if (!isSpinning) {
        startSpin();
      }
    }

    // ----- reset and draw initial -----
    function initWheel() {
      // set a random initial rotation so it looks fresh
      currentAngle = Math.random() * 2 * Math.PI;
      drawWheel(currentAngle);
      updateResult(currentAngle);
      spinBtn.disabled = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      isSpinning = false;
      spinVelocity = 0;
    }

    // ----- event binding -----
    canvas.addEventListener('click', handleCanvasClick);
    spinBtn.addEventListener('click', startSpin);

    // optional: touch support for canvas
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isSpinning) startSpin();
    }, { passive: false });

    // draw on load
    initWheel();

    // also update result on window resize (redraw)
    window.addEventListener('resize', () => {
      drawWheel(currentAngle);
    });

    // expose restart (for any reason)
    window.resetWheel = initWheel;
  })();
</script>
</body>
</html>
