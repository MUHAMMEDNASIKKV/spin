<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Spinner Wheel</title>
  <!-- Google Fonts & Canvas Confetti Library -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    /* Wheel Area */
    .wheel-wrapper {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
    }

    /* Top Center Pointer Pointer */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 40px;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .pointer svg {
      width: 100%;
      height: 100%;
      fill: #f43f5e;
    }

    /* SVG Canvas Wheel */
    #wheel {
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
    }

    /* Spin Button */
    .spin-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.2s ease;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Fullscreen Result Modal Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 2rem;
      text-align: center;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-subtitle {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.875rem;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .modal-title {
      font-size: 2.75rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2rem;
      line-height: 1.2;
    }

    .close-btn {
      background: #f43f5e;
      color: white;
      border: none;
      padding: 0.875rem 2.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.4);
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: #e11d48;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .wheel-wrapper {
        width: 320px;
        height: 320px;
      }
      .modal-title {
        font-size: 2rem;
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>College Selection Wheel</h1>
    
    <div class="wheel-wrapper">
      <div class="pointer">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="rotate(180 12 12)" />
        </svg>
      </div>
      <svg id="wheel" viewBox="0 0 500 500"></svg>
    </div>

    <button id="spinBtn" class="spin-btn">SPIN WHEEL</button>
  </div>

  <!-- Fullscreen Modal -->
  <div id="resultOverlay" class="overlay">
    <div class="modal-card">
      <p class="modal-subtitle">Selected College</p>
      <h2 id="collegeName" class="modal-title">COLLEGE NAME</h2>
      <button id="closeBtn" class="close-btn">Spin Again</button>
    </div>
  </div>

  <script>
    const colleges = [
      "DUIDC THOOTHA",
      "BUAC MANIYOOR",
      "DH CHEMMAD",
      "SHIC PARAPPUR",
      "DNIC VALLAPPUZHA",
      "DNAC KOONANCHERY"
    ];

    const sliceColors = [
      "#4f46e5", // Indigo
      "#0891b2", // Cyan
      "#059669", // Emerald
      "#d97706", // Amber
      "#e11d48", // Rose
      "#7c3aed"  // Violet
    ];

    const wheelSvg = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const overlay = document.getElementById('resultOverlay');
    const closeBtn = document.getElementById('closeBtn');
    const collegeNameHeading = document.getElementById('collegeName');

    const numSlices = colleges.length;
    const sliceAngle = 360 / numSlices;
    let currentRotation = 0;

    // Build the SVG Wheel dynamically
    function drawWheel() {
      const radius = 250;
      const center = 250;
      let svgHtml = '';

      colleges.forEach((college, i) => {
        const startDeg = i * sliceAngle;
        const endDeg = startDeg + sliceAngle;
        
        // Convert polar coordinates to Cartesian
        const startRad = (startDeg - 90) * Math.PI / 180;
        const endRad = (endDeg - 90) * Math.PI / 180;

        const x1 = center + radius * Math.cos(startRad);
        const y1 = center + radius * Math.sin(startRad);
        const x2 = center + radius * Math.cos(endRad);
        const y2 = center + radius * Math.sin(endRad);

        const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

        // Text orientation angle
        const midDeg = startDeg + sliceAngle / 2;
        const textRad = (midDeg - 90) * Math.PI / 180;
        const textX = center + (radius * 0.62) * Math.cos(textRad);
        const textY = center + (radius * 0.62) * Math.sin(textRad);

        svgHtml += `
          <path d="${pathData}" fill="${sliceColors[i]}" stroke="#0f172a" stroke-width="3" />
          <text 
            x="${textX}" 
            y="${textY}" 
            fill="#ffffff" 
            font-size="13" 
            font-weight="700" 
            text-anchor="middle" 
            dominant-baseline="middle"
            transform="rotate(${midDeg}, ${textX}, ${textY})"
          >
            ${college}
          </text>
        `;
      });

      // Add center cap decor
      svgHtml += `
        <circle cx="${center}" cy="${center}" r="35" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
        <circle cx="${center}" cy="${center}" r="15" fill="#6366f1"/>
      `;

      wheelSvg.innerHTML = svgHtml;
    }

    drawWheel();

    // Spin mechanism
    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;

      // Random full spins (5 to 8) plus random segment pick
      const randomRotations = (Math.floor(Math.random() * 4) + 5) * 360;
      const randomDegree = Math.floor(Math.random() * 360);
      
      currentRotation += randomRotations + randomDegree;
      wheelSvg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        // Calculate which slice ended at the top (0 degrees / pointer position)
        const normalizedDegree = (360 - (currentRotation % 360)) % 360;
        const selectedIndex = Math.floor(normalizedDegree / sliceAngle);
        const selectedCollege = colleges[selectedIndex];

        // Display Result Modal & Trigger Confetti
        collegeNameHeading.textContent = selectedCollege;
        overlay.classList.add('active');

        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });

      }, 5000); // Matches the CSS 5-second transition duration
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      spinBtn.disabled = false;
    });
  </script>
</body>
</html>
