<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Spinner Wheel</title>
  <!-- Google Fonts & Canvas Confetti Library -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .status-badge {
      font-size: 0.875rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.4rem 1.2rem;
      border-radius: 9999px;
      color: #a5b4fc;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Wheel Area */
    .wheel-wrapper {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
    }

    /* Top Center Pointer */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 40px;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .pointer svg {
      width: 100%;
      height: 100%;
      fill: #f43f5e;
    }

    /* SVG Canvas Wheel */
    #wheel {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* Action Buttons */
    .spin-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.2s ease;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1rem 1.75rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Fullscreen Result Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 2rem;
      text-align: center;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-subtitle {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.875rem;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .modal-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .modal-note {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .close-btn {
      background: #f43f5e;
      color: white;
      border: none;
      padding: 0.875rem 2.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.4);
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: #e11d48;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .wheel-wrapper {
        width: 320px;
        height: 320px;
      }
      .modal-title {
        font-size: 1.85rem;
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>College Selection Wheel</h1>
    <div id="statusBadge" class="status-badge">6 Colleges Remaining</div>
    
    <div class="wheel-wrapper">
      <div class="pointer">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="rotate(180 12 12)" />
        </svg>
      </div>
      <svg id="wheel" viewBox="0 0 500 500"></svg>
    </div>

    <div class="btn-group">
      <button id="spinBtn" class="spin-btn">SPIN WHEEL</button>
      <button id="resetBtn" class="reset-btn">Reset All</button>
    </div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="resultOverlay" class="overlay">
    <div class="modal-card">
      <p class="modal-subtitle">Selected College</p>
      <h2 id="collegeName" class="modal-title">COLLEGE NAME</h2>
      <p id="modalNote" class="modal-note">This college has been removed from remaining choices.</p>
      <button id="closeBtn" class="close-btn">Continue</button>
    </div>
  </div>

  <script>
    const defaultColleges = [
      "DUIDC THOOTHA",
      "BUAC MANIYOOR",
      "DH CHEMMAD",
      "SHIC PARAPPUR",
      "DNIC VALLAPPUZHA",
      "DNAC KOONANCHERY"
    ];

    const sliceColors = [
      "#4f46e5", // Indigo
      "#0891b2", // Cyan
      "#059669", // Emerald
      "#d97706", // Amber
      "#e11d48", // Rose
      "#7c3aed"  // Violet
    ];

    let activeColleges = [...defaultColleges];
    let selectedIndexToRemove = null;

    const wheelSvg = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');
    const overlay = document.getElementById('resultOverlay');
    const closeBtn = document.getElementById('closeBtn');
    const collegeNameHeading = document.getElementById('collegeName');
    const statusBadge = document.getElementById('statusBadge');
    const modalNote = document.getElementById('modalNote');

    let currentRotation = 0;

    // Draw Wheel Dynamically according to activeColleges length
    function drawWheel() {
      const numSlices = activeColleges.length;
      statusBadge.textContent = `${numSlices} College${numSlices === 1 ? '' : 's'} Remaining`;

      if (numSlices === 0) {
        wheelSvg.innerHTML = `
          <circle cx="250" cy="250" r="240" fill="#1e293b" stroke="#334155" stroke-width="4"/>
          <text x="250" y="250" fill="#94a3b8" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">
            All Colleges Picked!
          </text>
        `;
        spinBtn.disabled = true;
        return;
      }

      const sliceAngle = 360 / numSlices;
      const radius = 250;
      const center = 250;
      let svgHtml = '';

      activeColleges.forEach((college, i) => {
        const startDeg = i * sliceAngle;
        const endDeg = startDeg + sliceAngle;
        
        const startRad = (startDeg - 90) * Math.PI / 180;
        const endRad = (endDeg - 90) * Math.PI / 180;

        const x1 = center + radius * Math.cos(startRad);
        const y1 = center + radius * Math.sin(startRad);
        const x2 = center + radius * Math.cos(endRad);
        const y2 = center + radius * Math.sin(endRad);

        const pathData = (numSlices === 1) 
          ? `M ${center - radius} ${center} A ${radius} ${radius} 0 1 0 ${center + radius} ${center} A ${radius} ${radius} 0 1 0 ${center - radius} ${center}` 
          : `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

        const midDeg = startDeg + sliceAngle / 2;
        const textRad = (midDeg - 90) * Math.PI / 180;
        const textX = center + (radius * 0.6) * Math.cos(textRad);
        const textY = center + (radius * 0.6) * Math.sin(textRad);

        svgHtml += `
          <path d="${pathData}" fill="${sliceColors[i % sliceColors.length]}" stroke="#0f172a" stroke-width="3" />
          <text 
            x="${textX}" 
            y="${textY}" 
            fill="#ffffff" 
            font-size="${numSlices > 4 ? 13 : 16}" 
            font-weight="700" 
            text-anchor="middle" 
            dominant-baseline="middle"
            transform="rotate(${midDeg}, ${textX}, ${textY})"
          >
            ${college}
          </text>
        `;
      });

      // Center Knob
      svgHtml += `
        <circle cx="${center}" cy="${center}" r="35" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
        <circle cx="${center}" cy="${center}" r="15" fill="#6366f1"/>
      `;

      wheelSvg.innerHTML = svgHtml;
    }

    function init() {
      currentRotation = 0;
      wheelSvg.style.transition = 'none';
      wheelSvg.style.transform = 'rotate(0deg)';
      spinBtn.disabled = false;
      drawWheel();
    }

    init();

    // Spin mechanism
    spinBtn.addEventListener('click', () => {
      if (activeColleges.length === 0) return;

      spinBtn.disabled = true;

      // Add rotation animation
      wheelSvg.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';

      const numSlices = activeColleges.length;
      const sliceAngle = 360 / numSlices;

      const randomRotations = (Math.floor(Math.random() * 4) + 5) * 360;
      const randomDegree = Math.floor(Math.random() * 360);
      
      currentRotation += randomRotations + randomDegree;
      wheelSvg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        // Find which slice aligned with top center pointer
        const normalizedDegree = (360 - (currentRotation % 360)) % 360;
        selectedIndexToRemove = Math.floor(normalizedDegree / sliceAngle);
        const selectedCollege = activeColleges[selectedIndexToRemove];

        // Display Result Modal & Trigger Confetti
        collegeNameHeading.textContent = selectedCollege;
        
        if (activeColleges.length === 1) {
          modalNote.textContent = "That was the last remaining college on the wheel!";
        } else {
          modalNote.textContent = "This college has been removed for the next spin.";
        }

        overlay.classList.add('active');

        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });

      }, 5000);
    });

    // Close Modal and Remove Selected Slice
    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');

      if (selectedIndexToRemove !== null) {
        // Remove winning college from list
        activeColleges.splice(selectedIndexToRemove, 1);
        selectedIndexToRemove = null;

        // Reset wheel alignment instantly without smooth scroll transition back
        wheelSvg.style.transition = 'none';
        currentRotation = 0;
        wheelSvg.style.transform = 'rotate(0deg)';

        // Redraw wheel layout with reduced slices
        drawWheel();
      }

      if (activeColleges.length > 0) {
        spinBtn.disabled = false;
      }
    });

    // Reset All Colleges
    resetBtn.addEventListener('click', () => {
      activeColleges = [...defaultColleges];
      init();
    });
  </script>
</body>
</html>
